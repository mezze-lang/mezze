# Tests run in a SHUFFLED order, with a PINNED seed.
#
# Shuffled, because this suite was order-dependent and nobody could see it: the
# usual declaration order happened to be one that worked. Under a randomised
# order, `AbilityOrphanRulesTest.ability impl is visible when ability is
# imported` and `NewtypeComprehensiveTest.can use imported newtype as parameter
# type` both failed, because `TypeChecker.clearCache()` reset two of the three
# process-global caches and the third (ModuleTypeChecker's module cache) kept
# whatever an earlier test had typechecked.
#
# Pinned, because a suite whose order changes every run turns a latent
# order-dependence into intermittent CI failures that are nobody's turn to fix.
# A fixed non-declaration order gives the coverage without the flakiness: the
# same run twice gives the same answer, and a new dependence on declaration
# order still fails immediately.
#
# Verified across seeds 20260923, 11111, 777 and 424242 plus three unseeded
# shuffles. Change the seed deliberately — a failure after changing it is a real
# isolation bug, not noise.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.execution.order.random.seed=20260923
