id = "mezze"
name = "Mezze"
description = "Mezze language support for Zed — tree-sitter syntax + the mez LSP (diagnostics, hover, completion, semantic tokens, code actions)."
version = "0.1.0"
schema_version = 1
authors = ["Mezze"]
repository = "https://github.com/mezze-lang/mezze"

# The Mezze language server: `mez lsp` over stdio. The extension resolves `mez`
# from PATH (or a user-configured path — see languages/mezze/config.toml and the
# lsp binary settings). Provides diagnostics, hover, completion, go-to-def,
# code actions, and SEMANTIC TOKENS (the resolution-based coloring the
# tree-sitter grammar can't do on its own).
[language_servers.mezze]
name = "Mezze LSP"
language = "Mezze"

# Tree-sitter grammar. Zed fetches the grammar from a git remote by commit and
# builds it to WASM, so `commit` MUST be a hash that is PUSHED to `repository`
# and whose tree contains `tooling/tree-sitter-mezze` (grammar.js + src/).
# Update this to the pushed HEAD of the branch carrying the grammar before
# installing. See README for the local-dev workflow.
#
# Check it before trusting it — `git cat-file -t <commit>` on this repo. The
# previous value named an object that does not exist here at all, so Zed could
# not fetch a grammar to build. A stale-but-real hash is the worse failure of
# the two: the queries shipped in this extension are generated against the
# CURRENT grammar, and a pin predating a new node makes them name something the
# fetched grammar lacks — which costs the whole query file, not one pattern.
[grammars.mezze]
repository = "https://github.com/mezze-lang/mezze"
# = origin/main. A pin is a coordinate into the REMOTE, so it is only ever
# correct for a PUSHED commit — bump it as part of pushing a grammar change,
# never before.
#
# Verify with `tooling/syntax-generators/check-zed-pin.sh`, which archives this
# exact tree and resolves the shipped queries against its node-types.json. Do
# NOT verify with `tree-sitter query`: that resolves a language by NAME and
# loads ~/.cache/tree-sitter/lib/mezze.so, built from whatever you last
# generated, so it reports success against a grammar it is not testing.
commit = "e987b953d5edbf75620f341bc0c0ad3548c4a937"
path = "tooling/tree-sitter-mezze"
