name = "Mezze"
grammar = "mezze"
path_suffixes = ["mz"]
line_comments = ["# "]
autoclose_before = ",=}])|"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false },
]
# `##` is a doc comment; `#` a line comment (both require a trailing space —
# mirrors the parser's tightened comment rule). `#{ … }` is metadata.
