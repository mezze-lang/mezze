# JVM arguments to suppress native access warnings
org.gradle.jvmargs=-XX:+EnableDynamicAgentLoading --enable-native-access=ALL-UNNAMED

# Gradle daemon configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-detect=true

# Gate memory guard (2026-11-20). Several agent sessions build and test on one 27 GB
# machine at once; idle daemons that default to a 3-hour life, and Kotlin compile
# daemons that default to a quarter of RAM EACH, ate the headroom the gates needed,
# and the box swapped itself into a freeze five times in a week. Idle daemons now
# die in five minutes, and a Kotlin daemon is capped. The fork guard that sizes a
# test task by the memory actually available lives in the root build.gradle.kts.
org.gradle.daemon.idletimeout=300000
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m