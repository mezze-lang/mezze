# Cut a mez toolchain release — multi-platform.
#
# Trigger: push a tag like `v0.1.0` (or run manually with a version). For each
# platform it builds the full ~/.mezze toolchain via `installNative` — the
# versioned native binary under toolchains/<ver>/ (stdlib embedded, so
# `mez check`/`fmt`/`init` run with no JVM), its `mezze-runtime.jar` (used by
# `mez dev`/`build` on the user's own GraalVM), the stdlib sources, a PATH proxy
# at bin/mez, and a settings.toml defaulting to this version — then tars it as
# `mez-<ver>-<platform>.tar.gz`. A final job attaches every tarball + the
# install script to one GitHub Release.
#
# Install (see install.sh): `curl -fsSL <release-or-raw>/install.sh | sh`, or
# unpack a tarball yourself into ~/.mezze and put ~/.mezze/bin on PATH. Anonymous
# install needs the release assets to be PUBLIC (public repo, or a public
# releases repo); a private repo needs a token.
#
# The linux-x64 build + tar + extract + run flow was verified locally end-to-end.
# The macOS and linux-arm64 jobs follow the same steps on their runners (not
# exercised here); native-image for macOS is already configured in
# cli/build.gradle (system C compiler / SDK). Windows (build-windows job) is the
# least-proven platform: it uses PowerShell + a .zip and relies on setup-graalvm
# configuring MSVC — expect the first real run to need iteration. It is
# best-effort: `release` publishes linux + macOS even if Windows fails.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0), without a leading v'
        required: true
      only:
        description: 'Limit a verify run to one platform group: windows | unix | (blank = all)'
        required: false
        default: ''

jobs:
  build:
    # The linux + macOS matrix. Skipped when a verify dispatch targets only
    # Windows; always runs on a tag push (inputs.only is empty there).
    if: github.event.inputs.only != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    asset: linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: linux-arm64 }   # public-repo ARM runner
          # macos-13 was RETIRED on 2025-12-04, along with -large and -xlarge.
          # A job asking for a dead label does not fail — it queues forever, so
          # this sat at "Waiting for a runner to pick up this job" for 4h46m and
          # blocked `publish`, which gates on the unix builds. macos-15-intel is
          # the replacement, and the LAST x86_64 macOS image GitHub will publish:
          # supported to August 2027, after which hosted Intel macOS is gone and
          # darwin-x64 needs a self-hosted box or dropping.
          - { runner: macos-15-intel,   asset: darwin-x64 }    # Intel
          - { runner: macos-14,         asset: darwin-arm64 }  # Apple Silicon
    runs-on: ${{ matrix.runner }}
    # A dead runner label, a hung child or a stalled download otherwise burns
    # GitHub's 6-hour default before anyone looks. Native-image builds here take
    # ~5 minutes; 45 is generous and still fails fast.
    timeout-minutes: 45
    steps:
      - name: Check out the toolchain
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up GraalVM CE 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # installNative targets ${user.home}/.mezze; point user.home at a staging
      # dir so the runner home stays clean and the tarball holds exactly the
      # install layout. -Pversion flows into the toolchain version + BuildInfo.
      - name: Build the toolchain (installNative into a staging home)
        run: |
          STAGING="${{ runner.temp }}/relstage"
          mkdir -p "$STAGING"
          ./gradlew --no-daemon -Pversion=${{ steps.v.outputs.version }} \
            -Duser.home="$STAGING" :cli:installNative
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"

      - name: Assemble + smoke-test the install tarball
        run: |
          ver=${{ steps.v.outputs.version }}
          tarball="mez-$ver-${{ matrix.asset }}.tar.gz"
          tar -czf "$tarball" -C "$STAGING/.mezze" .
          echo "built $tarball ($(du -h "$tarball" | cut -f1))"
          # Smoke test: extract into a fresh home and run the proxy standalone.
          FRESH="${{ runner.temp }}/fresh/.mezze"
          mkdir -p "$FRESH"
          tar -xzf "$tarball" -C "$FRESH"
          MEZZE_HOME="$FRESH" "$FRESH/bin/mez" --version

      - name: Upload the platform tarball
        uses: actions/upload-artifact@v4
        with:
          name: mez-${{ matrix.asset }}
          path: mez-*-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # Windows is a separate job: PowerShell (not bash), a .zip (not .tar.gz), and
  # native-image needs the MSVC toolchain — graalvm/setup-graalvm configures the
  # Visual Studio build environment on windows runners. This is the least-proven
  # platform; expect the first real run to need iteration.
  build-windows:
    # Skipped when a verify dispatch targets only unix; always runs on a tag push.
    if: github.event.inputs.only != 'unix'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the toolchain
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v','' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up GraalVM CE 25 (configures MSVC on Windows)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the toolchain (installNative into a staging home)
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'relstage'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          .\gradlew.bat --no-daemon "-Pversion=${{ steps.v.outputs.version }}" "-Duser.home=$staging" :cli:installNative
          "STAGING=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Assemble + smoke-test the install zip
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.version }}"
          $zip = "mez-$ver-windows-x64.zip"
          Compress-Archive -Path (Join-Path $env:STAGING '.mezze\*') -DestinationPath $zip -Force
          Write-Host "built $zip"
          $fresh = Join-Path $env:RUNNER_TEMP 'fresh\.mezze'
          New-Item -ItemType Directory -Force -Path $fresh | Out-Null
          Expand-Archive -Path $zip -DestinationPath $fresh -Force
          $env:MEZZE_HOME = $fresh
          & (Join-Path $fresh 'bin\mez.exe') --version

      - name: Upload the Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: mez-windows-x64
          path: mez-*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [build, build-windows]
    # Publish only on a real tag push, and only if the (verified) unix builds
    # succeeded — Windows is best-effort, so its failure still ships linux+macOS.
    # A manual `workflow_dispatch` therefore just BUILDS every platform (artifacts
    # are downloadable from the run) without creating a Release — a safe way to
    # verify the whole matrix on a private repo before going public.
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # create the Release and upload assets
    steps:
      - name: Check out (for install scripts)
        uses: actions/checkout@v4

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mez-*
            install.sh
            install.ps1
          generate_release_notes: true
          # Anything with a hyphen in the tag — v0.0.0-alpha, -rc1, -beta2 — is a
          # prerelease. Without this a 0.0.0-alpha publishes as the LATEST
          # stable, which is also what install.sh resolves when MEZ_VERSION is
          # unset, so a first-time installer would get an alpha as the release
          # build. Derived from the tag rather than hardcoded, so it flips by
          # itself on the first clean v0.1.0 with no edit here. The flag is read
          # at publish time: fixing it afterwards means deleting the Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
