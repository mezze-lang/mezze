[package]
name = "polyglot_js"
version = "0.1.0"

[[app]]
name = "polyglot_js"
path = "src/app.mz"
entry = "main"

# `mezze-js` supplies:
#   - `.mz` source files: `use mezze_js::js::{ Js, GraalJs, JsForeign, ... }`
#   - `[maven]` block: the GraalJS jars (js-language + js-scriptengine)
#     and `polyglot-js-natives` — put on the wire child's classpath by
#     `mez sync` so `[polyglot.js]` boots successfully.
[dependencies]
mezze-js = "github:mezze-lang/mezze-js@0.5.1"

# `[polyglot.js]` opts this project in to the GraalJS Truffle language.
# GraalJS ships with no external prerequisites — pure ECMAScript is
# available out of the box once `mez sync` has fetched the jars.
#
# For CommonJS `require(...)` support, set `node_modules`:
#
#   [polyglot.js]
#   node_modules = "./node_modules"
#
# The runtime enables `js.commonjs-require = true` + points GraalJS's
# module resolver at that path when present.
[polyglot.js]

# Additional `js.<KEY>` Context options forwarded to Truffle. Example:
#
#   [polyglot.js.options]
#   strict = "true"
#
# See GraalJS documentation for the full option list.
[polyglot.js.options]
