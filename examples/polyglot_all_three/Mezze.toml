[package]
name = "polyglot_all_three"
version = "0.1.0"

[[app]]
name = "polyglot_all_three"
path = "src/app.mz"
entry = "main"

# JVM interop ships built-in — `std::polyglot::jvm` is always available.
# Python + JavaScript arrive as user-installed provider packages;
# `mez sync` pulls the `.mz` sources + the graalpy / graaljs jars.
[dependencies]
mezze-python = "github:mezze-lang/mezze-python@0.2.1"
mezze-js     = "github:mezze-lang/mezze-js@0.1.0"

# JVM interop needs no config beyond declaring the section.
[polyglot.jvm]
classpath = []

# Python interop — point at the same venv the numpy demo uses.
[polyglot.python]
python_path = "../../interpreter/build/graalpy-venv/venv/lib/python3.12/site-packages"

[polyglot.python.options]
PosixModuleBackend = "java"

# JavaScript interop needs no config beyond declaring the section.
[polyglot.js]
