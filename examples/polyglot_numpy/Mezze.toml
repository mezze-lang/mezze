[package]
name = "polyglot_numpy"
version = "0.1.0"

[[app]]
name = "polyglot_numpy"
path = "src/app.mz"
entry = "main"

[dependencies]

# Documentation-only for now: the mez CLI does not yet drive Python
# enablement from Mezze.toml. `just mez-run-numpy-demo` still sets
# MEZZE_ENABLE_PYTHON=1 + MEZZE_PYTHON_PATH; future work moves the
# wiring here so `mez exec` reads it automatically.
[polyglot.python]
enabled = true
# Path (relative to the repo root) that GraalPy should add to sys.path
# so `import numpy` resolves. See examples/polyglot_numpy/README.md for
# the venv bootstrap steps.
site-packages = "interpreter/build/graalpy-venv/venv/lib/python3.12/site-packages"
