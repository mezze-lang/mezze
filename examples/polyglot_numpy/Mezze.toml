[package]
name = "polyglot_numpy"
version = "0.1.0"

[[app]]
name = "polyglot_numpy"
path = "src/app.mz"
entry = "main"

# `mezze-python` supplies the Python interop surface and the graalpy
# jars.  `packages = ["numpy"]` under `[polyglot.python]` asks
# `mez sync` to invoke the provider's install template
# (`graalpy -m pip install --target .deps/python numpy`), landing
# numpy site-packages under `.deps/python/` — the runtime points
# `python.PythonPath` there automatically.
[dependencies]
mezze-python = "github:mezze-lang/mezze-python@0.2.1"

# `[polyglot.python]` opts this project in to the GraalPy Truffle
# language. The `packages` list drives the provider's install phase.
# Requires the toolchain graalpy on PATH — see README.md.
[polyglot.python]
packages = ["numpy"]

# Additional `python.<KEY>` Context options forwarded to Truffle. The
# Java POSIX backend keeps embedded GraalPy off host libc — required
# when running inside the same JVM as Mezze without a POSIX resource
# lib set up.
[polyglot.python.options]
PosixModuleBackend = "java"
