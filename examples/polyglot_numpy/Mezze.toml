[package]
name = "polyglot_numpy"
version = "0.1.0"

[[app]]
name = "polyglot_numpy"
path = "src/app.mz"
entry = "main"

[dependencies]

# `[polyglot.python]` opts this project in to the GraalPy Truffle
# language and points `sys.path` at the venv site-packages numpy was
# installed into. Bootstrap the venv with `just polyglot-setup-python`
# (see README).
#
# `python_path` is resolved relative to THIS manifest's directory, so
# committing `../../interpreter/build/graalpy-venv/…` is enough — the
# caller's cwd doesn't matter.
[polyglot.python]
python_path = "../../interpreter/build/graalpy-venv/venv/lib/python3.12/site-packages"

# Additional `python.<KEY>` Context options forwarded to Truffle. The
# Java POSIX backend keeps embedded GraalPy off host libc — required
# when running inside the same JVM as Mezze without a POSIX resource
# lib set up.
[polyglot.python.options]
PosixModuleBackend = "java"
